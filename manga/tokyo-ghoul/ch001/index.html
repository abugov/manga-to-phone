<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tokyo Ghoul - Chapter 1: Tragedy - Webtoon Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Top Header Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(14, 14, 14, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    header.hidden {
      transform: translateY(-100%);
    }
    .back-btn {
      color: #ff4757;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .back-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }
    .title-area {
      text-align: center;
      max-width: 45%;
      overflow: hidden;
    }
    .manga-name {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chapter-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rotate-toggle {
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ddd;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .rotate-toggle.active {
      background: #ff4757;
      color: #fff;
      border-color: #ff4757;
    }
    .progress-pill {
      font-size: 11px;
      font-weight: 600;
      background: #202020;
      padding: 5px 8px;
      border-radius: 8px;
      color: #aaa;
    }
    /* Top Progress Bar */
    .progress-bar-container {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      z-index: 101;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b81, #ff4757);
      transition: width 0.1s linear;
    }
    /* Reader Canvas */
    #reader {
      width: 100%;
      max-width: 760px;
      margin-top: 52px;
      margin-bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0b0b0b;
    }
    .panel-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 8px 0;
      position: relative;
    }
    .webtoon-panel {
      width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
      transition: transform 0.25s ease, max-width 0.25s ease;
      border-radius: 2px;
    }
    /* Wide panel rotation mode (90 degrees landscape for phone tilting) */
    body.rotate-wide-mode .panel-wrapper[data-wide="true"] {
      padding: 60px 0;
      overflow: visible;
    }
    body.rotate-wide-mode .panel-wrapper[data-wide="true"] .webtoon-panel {
      transform: rotate(90deg) scale(1.15);
      cursor: pointer;
    }
    /* End of Chapter Section */
    .chapter-end {
      padding: 50px 20px 90px 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
    .chapter-end h3 {
      color: #fff;
      font-size: 18px;
      margin-bottom: 8px;
    }
    /* Bottom Navigation Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(14, 14, 14, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    footer.hidden {
      transform: translateY(100%);
    }
    .nav-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .nav-btn:active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    /* Zoom Lightbox Modal */
    #zoomModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      overflow: auto;
      touch-action: pan-x pan-y pinch-zoom;
    }
    #zoomModal.active {
      display: flex;
    }
    #zoomImage {
      max-width: 98vw;
      max-height: 98vh;
      object-fit: contain;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
      cursor: zoom-out;
    }
    .zoom-hint {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(30, 30, 30, 0.8);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>

  <footer id="footer">
    <button class="nav-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">Top</button>
    <button class="nav-btn" onclick="toggleBars()">Toggle UI</button>
    <button class="nav-btn" onclick="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })">Bottom</button>
  </footer>

  <!-- Tap-to-Zoom Modal -->
  <div id="zoomModal" onclick="closeZoomModal()">
    <div class="zoom-hint">Tap anywhere to close • Pinch to zoom</div>
    <img id="zoomImage" src="" alt="Zoomed Panel">
  </div>

  <script>
    const header = document.getElementById('header');
    const footer = document.getElementById('footer');
    const progressBar = document.getElementById('progressBar');
    const counter = document.getElementById('counter');
    const panels = document.querySelectorAll('.webtoon-panel');
    const totalPanels = 144;
    const zoomModal = document.getElementById('zoomModal');
    const zoomImage = document.getElementById('zoomImage');
    const rotateToggle = document.getElementById('rotateToggle');

    // UI Bars Auto-hide on scroll
    let uiVisible = true;
    function toggleBars() {
      uiVisible = !uiVisible;
      header.classList.toggle('hidden', !uiVisible);
      footer.classList.toggle('hidden', !uiVisible);
    }

    // Toggle 90-degree rotation for wide panels
    let rotateWideMode = false;
    function toggleWideRotation() {
      rotateWideMode = !rotateWideMode;
      document.body.classList.toggle('rotate-wide-mode', rotateWideMode);
      rotateToggle.classList.toggle('active', rotateWideMode);
    }

    // Lightbox Zoom
    function openZoomModal(src) {
      zoomImage.src = src;
      zoomModal.classList.add('active');
    }
    function closeZoomModal() {
      zoomModal.classList.remove('active');
      zoomImage.src = '';
    }

    // Scroll progress & panel counter
    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPercent = (scrollTop / (scrollHeight || 1)) * 100;
      progressBar.style.width = Math.min(scrollPercent, 100) + '%';

      const midScreen = window.innerHeight / 2;
      for (let p of panels) {
        const rect = p.getBoundingClientRect();
        if (rect.top <= midScreen && rect.bottom >= midScreen) {
          counter.textContent = p.getAttribute('data-idx') + '/' + totalPanels;
          break;
        }
      }
    }, { passive: true });
  </script>
