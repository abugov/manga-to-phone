<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Tokyo Ghoul - Chapter 2 - Webtoon Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y pinch-zoom;
    }
    /* Top Header Bar - Always Visible */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(14, 14, 14, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
    }
    .back-btn {
      color: #ff4757;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .back-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }
    .title-area {
      text-align: center;
      max-width: 45%;
      overflow: hidden;
    }
    .manga-name {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chapter-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rotate-toggle {
      background: #222;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ddd;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .rotate-toggle.active {
      background: #ff4757;
      color: #fff;
      border-color: #ff4757;
    }
    .progress-pill {
      font-size: 11px;
      font-weight: 600;
      background: #202020;
      padding: 5px 8px;
      border-radius: 8px;
      color: #aaa;
    }
    /* Top Progress Bar */
    .progress-bar-container {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      z-index: 101;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b81, #ff4757);
      transition: width 0.1s linear;
    }
    /* Reader Canvas */
    #reader {
      width: 100%;
      max-width: 760px;
      margin-top: 56px;
      margin-bottom: 74px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0b0b0b;
    }
    .panel-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 8px 0;
      position: relative;
    }
    .webtoon-panel {
      width: 100%;
      height: auto;
      display: block;
      touch-action: pan-y pinch-zoom;
      transition: transform 0.25s ease, max-width 0.25s ease;
      border-radius: 2px;
    }
    /* Wide panel rotation mode (-90 degrees counter-clockwise for phone tilting) */
    body.rotate-wide-mode .panel-wrapper[data-wide="true"] {
      height: min(100vw, 760px);
      min-height: min(100vw, 760px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 24px 0;
      overflow: visible;
    }
    body.rotate-wide-mode .panel-wrapper[data-wide="true"] .webtoon-panel {
      transform: rotate(-90deg);
      transform-origin: center center;
      width: min(100vw, 760px);
      height: auto;
      max-width: none;
    }
    /* End of Chapter Section */
    .chapter-end {
      padding: 50px 20px 60px 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
      width: 100%;
      max-width: 400px;
    }
    .chapter-end h3 {
      color: #fff;
      font-size: 18px;
      margin-bottom: 6px;
    }
    .end-actions {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .end-nav-btn {
      background: #222;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline-block;
    }
    .end-nav-btn.primary {
      background: #ff4757;
      border-color: #ff4757;
    }
    /* Bottom Chapter Navigation Bar - Always Visible */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(14, 14, 14, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .nav-btn {
      background: #1e1e1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .nav-btn:active {
      background: #2a2a2a;
    }
    .nav-btn.primary {
      background: #ff4757;
      border-color: #ff4757;
      color: #fff;
    }
    .nav-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
      cursor: default;
    }
  </style>
</head>

  <script>
    const progressBar = document.getElementById('progressBar');
    const counter = document.getElementById('counter');
    const panels = document.querySelectorAll('.webtoon-panel');
    const totalPanels = 134;
    const rotateToggle = document.getElementById('rotateToggle');

    // Toggle 90-degree rotation for wide panels
    let rotateWideMode = false;
    function toggleWideRotation() {
      rotateWideMode = !rotateWideMode;
      document.body.classList.toggle('rotate-wide-mode', rotateWideMode);
      rotateToggle.classList.toggle('active', rotateWideMode);
    }

    // Scroll progress & panel counter
    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPercent = (scrollTop / (scrollHeight || 1)) * 100;
      progressBar.style.width = Math.min(scrollPercent, 100) + '%';

      const midScreen = window.innerHeight / 2;
      for (let p of panels) {
        const rect = p.getBoundingClientRect();
        if (rect.top <= midScreen && rect.bottom >= midScreen) {
          counter.textContent = p.getAttribute('data-idx') + '/' + totalPanels;
          break;
        }
      }
    }, { passive: true });
  </script>
