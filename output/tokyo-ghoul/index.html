<head>
  <meta charset="UTF-8">

  <title>Tokyo Ghoul Chapter 001 - Mobile Webtoon Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    /* Top Header Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    header.hidden {
      transform: translateY(-100%);
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .progress-pill {
      font-size: 12px;
      font-weight: 500;
      background: #2a2a2a;
      padding: 4px 10px;
      border-radius: 12px;
      color: #ff4757;
    }
    /* Progress bar */
    .progress-bar-container {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      height: 3px;
      background: transparent;
      z-index: 101;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b81, #ff4757);
      transition: width 0.1s linear;
    }
    /* Reader Container */
    #reader {
      width: 100%;
      max-width: 680px;
      margin-top: 52px;
      margin-bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #121212;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .webtoon-panel {
      width: 100%;
      height: auto;
      display: block;
      margin: 8px 0;
      background: #1a1a1a;
      transition: opacity 0.3s ease;
    }
    .webtoon-panel:first-child {
      margin-top: 0;
    }
    /* Bottom Navigation Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    footer.hidden {
      transform: translateY(100%);
    }
    .nav-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .nav-btn:active {
      background: #2a2a2a;
    }
    /* End of Chapter banner */
    .chapter-end {
      padding: 40px 20px 80px 20px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }
    .chapter-end h3 {
      color: #fff;
      margin-bottom: 8px;
    }
  </style>

    const counter = document.getElementById('counter');
    const panels = document.querySelectorAll('.webtoon-panel');
    const totalPanels = 176;

    let uiVisible = true;
    function toggleBars() {
      uiVisible = !uiVisible;
      header.classList.toggle('hidden', !uiVisible);
      footer.classList.toggle('hidden', !uiVisible);
    }

    window.addEventListener('click', (e) => {
      // Tap center of screen to toggle UI bars
      if (e.target.tagName !== 'BUTTON') {
        toggleBars();
      }
    });

    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      const scrollPercent = (scrollTop / (scrollHeight || 1)) * 100;
      
      progressBar.style.width = Math.min(scrollPercent, 100) + '%';

      // Update current panel count based on viewport
      let currentIdx = 1;
      const midScreen = window.innerHeight / 2;
      for (let p of panels) {
        const rect = p.getBoundingClientRect();
        if (rect.top <= midScreen && rect.bottom >= midScreen) {
          currentIdx = p.getAttribute('data-idx');
          break;
        }
      }
      counter.textContent = currentIdx + ' / ' + totalPanels;
    }, { passive: true });
  </script>
</body>
</html>
